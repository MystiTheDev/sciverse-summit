<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>First-Time Setup - SciVerse Summit</title>
    <link rel="icon" type="image/png" href="/images/sciverse_summit_logo_final.png">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/liquid-glass.css" rel="stylesheet">
    <script>
        // Theme init: apply saved theme before render (no flash). Defaults to light.
        (function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode-loading');
                if (document.body) document.body.classList.add('dark-mode');
                else document.addEventListener('DOMContentLoaded', function() {
                    document.body.classList.add('dark-mode');
                });
            }
        })();
    </script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f3ff 0%, #f8fafc 40%, #cffafe 100%);
            padding: 24px;
        }
        body.dark-mode {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #334155 100%);
        }
        .setup-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.45);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }
        .setup-head {
            background: linear-gradient(135deg, #06b6d4, #7c3aed);
            padding: 34px 36px 30px;
            text-align: center;
            color: #fff;
        }
        .setup-head .logo-icon {
            width: 64px; height: 64px; border-radius: 18px;
            background: rgba(255,255,255,0.16);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px; font-size: 1.8rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .setup-head h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: 0.02em; margin: 0; }
        .setup-head p { margin: 8px 0 0; font-size: 0.86rem; opacity: 0.9; }
        .setup-body { padding: 28px 36px 36px; }
        .setup-note {
            background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 12px;
            padding: 12px 16px; font-size: 0.82rem; color: #475569; margin-bottom: 22px;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .setup-note i { color: #f59e0b; margin-top: 2px; }
        .form-label { font-weight: 600; font-size: 0.82rem; color: #475569; }
        .form-control {
            border-radius: 10px; padding: 11px 14px;
            border: 1px solid #cbd5e1; font-size: 0.95rem;
        }
        .form-control:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.18); }
        .btn-create {
            width: 100%; padding: 13px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #06b6d4, #7c3aed);
            color: #fff; font-weight: 700; font-size: 1rem; letter-spacing: 0.02em;
            transition: all 0.2s ease; box-shadow: 0 8px 22px rgba(124,58,237,0.35);
        }
        .btn-create:hover { color: #fff; transform: translateY(-1px); box-shadow: 0 12px 30px rgba(124,58,237,0.5); }
        /* Phase 1: anime.js owns press motion — CSS keeps color/shadow only. */
        html body .btn-create:hover { transform: none; }
        html body .btn-create {
            transition: box-shadow .15s ease-out, background .15s ease-out !important;
        }
        .alert-danger { border-radius: 10px; font-size: 0.86rem; }
        .setup-foot { text-align: center; font-size: 0.76rem; color: #94a3b8; margin-top: 18px; }
        body.dark-mode .setup-card {
            position: relative;
            background: linear-gradient(160deg, rgba(30,41,59,0.72), rgba(15,23,42,0.5));
            border: 1px solid rgba(255,255,255,0.18);
            border-top-color: rgba(255,255,255,0.32);
            backdrop-filter: blur(34px) saturate(200%);
            -webkit-backdrop-filter: blur(34px) saturate(200%);
            box-shadow: 0 30px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
        }
        body.dark-mode .setup-card > * { position: relative; z-index: 1; }
        body.dark-mode .setup-note {
            background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12);
            color: #cbd5e1;
        }
        body.dark-mode .form-label { color: #cbd5e1; }
        body.dark-mode .form-control {
            background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.16);
            color: #f1f5f9;
        }
        body.dark-mode .form-control::placeholder { color: #64748b; }
        body.dark-mode .form-control:focus {
            border-color: #06b6d4; background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(6,182,212,0.22);
        }
        body.dark-mode .setup-foot { color: #64748b; }

        .svm-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(6,182,212,0.25);
            border-top-color: #06b6d4;
            border-radius: 50%;
        }
    </style>
</head>
<body class="liquid-glass">

    <div class="setup-card lg-reactive">
        <div class="setup-head">
            <div class="logo-icon"><i class="bi bi-person-badge-fill"></i></div>
            <h1>First-Time Setup</h1>
            <p>Create the chair account for your conference</p>
        </div>
        <div class="setup-body">
            <div class="setup-note">
                <i class="bi bi-info-circle-fill"></i>
                <span>
                    You are signed in with a temporary administrator account.
                    Create the chair account below - the temporary admin account is then
                    <strong>permanently deleted</strong> and you will be signed out.
                </span>
            </div>

            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}">Error</div>

            <form method="post" action="/setup" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" maxlength="40" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" maxlength="120" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Chair's Full Name</label>
                    <input type="text" class="form-control" name="fullName" maxlength="120">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" minlength="6" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" name="confirmPassword" minlength="6" required>
                </div>
                <button type="submit" class="btn-create">
                    <i class="bi bi-shield-check me-1"></i> Create Chair &amp; Finish Setup
                </button>
            </form>

            <div class="setup-foot">SciVerse Summit - Committee Management</div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/liquid-glass.js"></script>
    <script src="/js/anime.min.js"></script>
    <script src="/js/anime-init.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.sciVerseAnime) window.sciVerseAnime.initPage('setup');
        });
    </script>
</body>
</html>
