<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Accounts - SciVerse Summit</title>
    <link rel="icon" type="image/png" href="/images/sciverse_summit_logo_final.png">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode-loading');
                if (document.body) document.body.classList.add('dark-mode');
                else document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
            }
        })();
    </script>
    <style>
        :root {
            --sidebar-width: 250px;
            --bg-primary: #f8fafc; --bg-card: #ffffff; --bg-secondary: #f1f5f9; --bg-elevated: #ffffff;
            --text-primary: #1e293b; --text-secondary: #475569; --text-muted: #94a3b8;
            --border-color: #e2e8f0; --border-strong: #cbd5e1;
            --accent-primary: #06b6d4; --accent-secondary: #7c3aed;
            --accent-success: #10b981; --accent-warning: #f59e0b; --accent-danger: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 16px rgba(0,0,0,0.06); --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
            --glass-bg: rgba(255,255,255,0.55); --glass-border: rgba(255,255,255,0.5);
        }
        body.dark-mode {
            --bg-primary: #0f172a; --bg-card: #1e293b; --bg-secondary: #334155; --bg-elevated: #1e293b;
            --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --text-muted: #94a3b8;
            --border-color: #334155; --border-strong: #475569;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3); --shadow-md: 0 4px 16px rgba(0,0,0,0.3); --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
            --glass-bg: rgba(30,41,59,0.65); --glass-border: rgba(255,255,255,0.12);
        }
        body { background: var(--bg-primary); color: var(--text-primary); transition: background 0.3s ease, color 0.3s ease; }
        .sidebar { position: fixed; top: 80px; left: 0; height: calc(100% - 80px); width: var(--sidebar-width); padding-top: 0.5rem; background-color: var(--bg-secondary); z-index: 1000; transition: all 0.3s; }
        .content { margin-left: var(--sidebar-width); padding: 95px 20px 40px 20px; position: relative; z-index: 1; transition: all 0.3s; }
        @media (max-width: 991.98px) { .sidebar { width: 0; } .content { margin-left: 0; } }
        #sidebarMenu.collapsing, #sidebarMenu.collapse:not(.show) { transform: translateX(calc(-1 * var(--sidebar-width))); margin-left: 0; }

        .page-heading { font-size: 1.6rem; font-weight: 700; color: var(--text-primary); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 0; display: flex; align-items: center; gap: 12px; }
        .page-heading i { color: var(--accent-primary); font-size: 1.7rem; }
        .page-subtitle { color: var(--text-muted); font-size: 0.88rem; font-weight: 500; margin: 6px 0 0 40px; }
        .heading-block { margin-bottom: 1.5rem; }

        .users-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }
        .modern-table { margin: 0; background: var(--bg-elevated); }
        .modern-table thead { background: linear-gradient(135deg, var(--bg-secondary), var(--border-color)); }
        .modern-table thead th { padding: 16px 20px; font-weight: 700; font-size: 0.82rem; color: var(--text-primary); text-align: center; border: none; letter-spacing: 0.05em; text-transform: uppercase; }
        .modern-table thead th:first-child { text-align: left; }
        .modern-table tbody tr { border-bottom: 1px solid var(--border-color); }
        .modern-table tbody tr:last-child { border-bottom: none; }
        .modern-table tbody td { padding: 14px 20px; vertical-align: middle; font-size: 0.92rem; color: var(--text-primary); text-align: center; }
        .modern-table tbody td:first-child { text-align: left; font-weight: 700; }

        .user-badge { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #06b6d4, #7c3aed); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; flex-shrink: 0; box-shadow: 0 3px 10px rgba(124,58,237,0.35); }
        .user-name { font-size: 0.92rem; font-weight: 700; color: var(--text-primary); }
        .user-email { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; margin-top: 1px; }

        .role-select {
            border-radius: 8px; padding: 7px 10px; font-size: 0.85rem; font-weight: 600;
            border: 1px solid var(--border-strong); background: var(--bg-elevated); color: var(--text-primary);
        }
        .role-select:focus { border-color: var(--accent-primary); }

        .action-btn { padding: 8px 15px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; border: none; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
        .action-btn.update { background: #dbeafe; color: #1e40af; }
        .action-btn.update:hover { background: #bfdbfe; transform: translateY(-1px); }
        .action-btn.delete { background: #fee2e2; color: #991b1b; }
        .action-btn.delete:hover { background: #fecaca; transform: translateY(-1px); }
        body.dark-mode .action-btn.update { background: rgba(6,182,212,0.16); color: #93c5fd; }
        body.dark-mode .action-btn.update:hover { background: rgba(6,182,212,0.26); }
        body.dark-mode .action-btn.delete { background: rgba(239,68,68,0.16); color: #fca5a5; }
        body.dark-mode .action-btn.delete:hover { background: rgba(239,68,68,0.26); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 2rem; opacity: 0.5; }
        .empty-state p { margin-top: 10px; font-size: 0.9rem; }
        .flash-message { border-radius: 12px; font-size: 0.88rem; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body class="liquid-glass">
    <style>
        /* LIQUID GLASS - admin-users */
        body.liquid-glass .users-card {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(248,250,252,0.45));
            backdrop-filter: blur(34px) saturate(220%);
            -webkit-backdrop-filter: blur(34px) saturate(220%);
            border-color: rgba(255,255,255,0.6);
            box-shadow:
                0 20px 52px rgba(15,23,42,0.12),
                inset 0 1px 0 rgba(255,255,255,0.85);
        }
        body.liquid-glass.dark-mode .users-card {
            background: linear-gradient(160deg, rgba(30,41,59,0.60), rgba(15,23,42,0.42));
            border-color: rgba(255,255,255,0.14);
            box-shadow:
                0 20px 52px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.10);
        }
        body.liquid-glass .users-card > * { position: relative; z-index: 1; }
    </style>

    <div th:replace="fragments :: header"></div>
    <div th:replace="fragments :: sidebar"></div>

    <!-- Notification banner (toast popups for server notifications) -->
    <div id="notifBanner" style="display:none;position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:1998;max-width:640px;width:92%;">
        <div id="notifBannerInner" style="border-radius:16px;padding:18px 24px;box-shadow:0 12px 40px rgba(0,0,0,0.25);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,#06b6d4,#7c3aed);">
            <div style="flex:1;min-width:200px;">
                <div id="notifBannerTitle" style="color:#fff;font-weight:800;font-size:0.95rem;margin-bottom:3px;"></div>
                <div id="notifBannerMsg" style="color:rgba(255,255,255,0.85);font-size:0.82rem;"></div>
            </div>
            <a id="notifBannerLink" href="#" style="background:#fff;color:#06b6d4;font-weight:800;border-radius:12px;padding:9px 20px;text-decoration:none;white-space:nowrap;font-size:0.88rem;display:none;"><i class="bi bi-box-arrow-up-right me-1"></i><span id="notifBannerLinkText">View</span></a>
            <button id="notifBannerDismiss" style="background:none;border:none;color:rgba(255,255,255,0.8);font-size:1.1rem;cursor:pointer;padding:4px;"><i class="bi bi-x-lg"></i></button>
        </div>
    </div>

    <div class="content">
        <div class="container-fluid p-0 mx-auto" style="width: 80%;">
            <div class="heading-block entrance">
                <h2 class="page-heading"><i class="bi bi-people-fill"></i>User Accounts</h2>
                <div class="page-subtitle"><i class="bi bi-key me-1"></i>Manage who can log in and whether they act as a Chair or a Delegate.</div>
            </div>

            <div th:if="${message}" class="alert alert-success flash-message mb-3" th:text="${message}">Done.</div>

            <div class="users-card entrance entrance-1 lg-reactive">
                <div class="table-responsive">
                    <table class="table modern-table mb-0">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td>
                                    <div class="user-badge" th:with="displayName=${u.fullName != null && !u.fullName.isBlank() ? u.fullName : u.username}">
                                        <div class="user-avatar"
                                             th:text="${#strings.isEmpty(displayName) ? '?' : #strings.toUpperCase(#strings.substring(displayName, 0, 1))}">U</div>
                                        <div>
                                            <div class="user-name" th:text="${displayName}">User Name</div>
                                            <div class="user-email" th:text="${u.email}">email@example.com</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <form th:action="@{/admin/users/update}" method="post" class="d-inline-flex align-items-center gap-2">
                                        <input type="hidden" name="userId" th:value="${u.id}">
                                        <select name="role" class="role-select">
                                            <option value="CHAIR" th:selected="${u.role == 'CHAIR'}">Chair</option>
                                            <option value="DELEGATE" th:selected="${u.role == 'DELEGATE'}">Delegate</option>
                                        </select>
                                        <button type="submit" class="action-btn update"><i class="bi bi-arrow-repeat"></i>Save</button>
                                    </form>
                                </td>
                                <td>
                                    <form th:action="@{/admin/users/delete}" method="post" class="d-inline"
                                          onsubmit="return confirm('Delete this account permanently?');">
                                        <input type="hidden" name="userId" th:value="${u.id}">
                                        <button type="submit" class="action-btn delete"><i class="bi bi-trash-fill"></i>Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${#lists.isEmpty(users)}" class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>No user accounts yet. Delegates are created when they register on the login page.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>window.NotifBannerConfig = { showLink: true };</script>
    <script src="/js/notif-banner.js"></script>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.sciVerseAnime) window.sciVerseAnime.initPage('admin-users');
        });
    </script>
</body>
</html>
