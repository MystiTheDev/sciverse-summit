<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Sciverse Summit</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Theme initialization script - prevents flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode-loading');
                document.body.classList.add('dark-mode');
            }
        })();
    </script>
    
    <style>
        /* Styles for the Layout Structure */
        :root {
            --sidebar-width: 250px;
        }
        .sidebar {
            position: fixed;
            top: 80px;
            left: 0;
            height: calc(100% - 80px);
            width: var(--sidebar-width); 
            padding-top: 0.5rem; 
            background-color: #f8f9fa;
            z-index: 1000; 
            transition: all 0.3s;
        }
        .content {
            margin-left: var(--sidebar-width); 
            padding: 95px 20px 20px 20px; 
            position: relative; 
            z-index: 1;
            transition: all 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* Style for when the sidebar is collapsed */
        #sidebarMenu.collapsing, #sidebarMenu.collapse:not(.show) {
            margin-left: calc(-1 * var(--sidebar-width));
        }
        
        .welcome-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 40px;
            text-align: center;
        }
        .action-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            min-width: 200px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-history {
            background-color: #4b5563;
            color: white;
            border: none;
        }
        .btn-history:hover {
            background-color: #374151;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(75, 85, 99, 0.3);
        }
        .btn-create {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border: none;
        }
        .btn-create:hover {
            background: linear-gradient(135deg, #4338ca, #4f46e5);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        /* Glassmorphism Modal Styles — scoped to dashboard modals only */
        #createSessionModal .modal-content,
        #continueSessionModal .modal-content,
        #ebReviewModal .modal-content {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-top-color: rgba(255, 255, 255, 0.32) !important;
            border-radius: 20px !important;
            box-shadow: 0 32px 72px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
        }

        #createSessionModal .modal-header,
        #continueSessionModal .modal-header,
        #ebReviewModal .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important;
        }

        #createSessionModal .modal-title,
        #continueSessionModal .modal-title,
        #ebReviewModal .modal-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.25rem;
        }

        #createSessionModal .modal-body,
        #continueSessionModal .modal-body,
        #ebReviewModal .modal-body {
            color: rgba(255, 255, 255, 0.88);
        }

        #createSessionModal .form-label,
        #continueSessionModal .form-label,
        #ebReviewModal .form-label {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #createSessionModal .form-control,
        #createSessionModal .form-select,
        #continueSessionModal .form-control,
        #continueSessionModal .form-select,
        #ebReviewModal .form-control,
        #ebReviewModal .form-select {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 10px !important;
            color: rgba(255, 255, 255, 0.95) !important;
            padding: 12px 16px;
        }

        #createSessionModal .form-control::placeholder,
        #continueSessionModal .form-control::placeholder,
        #ebReviewModal .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #createSessionModal .form-control:focus,
        #createSessionModal .form-select:focus,
        #continueSessionModal .form-control:focus,
        #continueSessionModal .form-select:focus,
        #ebReviewModal .form-control:focus,
        #ebReviewModal .form-select:focus {
            background: rgba(255, 255, 255, 0.12) !important;
            border-color: rgba(255, 255, 255, 0.4) !important;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1) !important;
            color: rgba(255, 255, 255, 0.95) !important;
        }

        #createSessionModal .form-select option,
        #continueSessionModal .form-select option,
        #ebReviewModal .form-select option {
            background: #1e293b;
            color: #fff;
        }

        .btn-close-white {
            filter: brightness(1) invert(1);
            opacity: 0.8;
        }

        .btn-close-white:hover {
            opacity: 1;
        }

        /* Modal Buttons */
        #createSessionModal .modal .btn-primary,
        #continueSessionModal .modal .btn-primary,
        #ebReviewModal .modal .btn-primary {
            background: rgba(79, 70, 229, 0.9);
            border: 1px solid rgba(79, 70, 229, 0.5);
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
        }

        #createSessionModal .modal .btn-primary:hover,
        #continueSessionModal .modal .btn-primary:hover,
        #ebReviewModal .modal .btn-primary:hover {
            background: rgba(79, 70, 229, 1);
            border-color: rgba(79, 70, 229, 0.8);
        }

        #createSessionModal .btn-success,
        #continueSessionModal .btn-success,
        #ebReviewModal .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: rgba(255, 255, 255, 0.95);
            font-weight: 700;
        }

        #createSessionModal .btn-success:hover,
        #continueSessionModal .btn-success:hover,
        #ebReviewModal .btn-success:hover {
            background: linear-gradient(135deg, #059669, #047857);
            border-color: rgba(16, 185, 129, 0.8);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        #createSessionModal .btn-outline-danger,
        #continueSessionModal .btn-outline-danger,
        #ebReviewModal .btn-outline-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        #createSessionModal .btn-outline-danger:hover,
        #continueSessionModal .btn-outline-danger:hover,
        #ebReviewModal .btn-outline-danger:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.6);
            color: #fecaca;
        }

        /* Dark Mode */
        body.dark-mode {
            background: #0f172a !important;
        }

        body.dark-mode .welcome-text {
            color: #f1f5f9 !important;
        }

        body.dark-mode .content {
            background: #0f172a !important;
        }

        /* Dark mode for buttons */
        body.dark-mode .btn-history {
            background: linear-gradient(135deg, #475569, #64748b);
            color: #f1f5f9;
        }

        body.dark-mode .btn-history:hover {
            background: linear-gradient(135deg, #64748b, #475569);
        }

        body.dark-mode .btn-create {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
        }

        body.dark-mode .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        body.dark-mode .text-muted {
            color: #94a3b8 !important;
        }
    </style>
</head>
<body>

    <!-- 1. HEADER (NAVBAR) FRAGMENT -->
    <div th:replace="fragments :: header"></div>

    <!-- 2. SIDEBAR FRAGMENT (REMOVED for Dashboard) -->
    <!-- <div th:replace="fragments :: sidebar"></div> -->

    <!-- 3. MAIN CONTENT AREA -->
    <div class="content" style="margin-left: 0;">
        
        <h1 class="welcome-text">Welcome! What would you like to do today?</h1>
        
        <div class="d-flex gap-4 align-items-start">
            <a href="/history" class="btn action-btn btn-history text-decoration-none d-flex align-items-center justify-content-center">
                <i class="bi bi-clock-history"></i> History
            </a>
            <button class="btn action-btn btn-create" data-bs-toggle="modal" data-bs-target="#createSessionModal">
                <i class="bi bi-plus-circle-fill"></i> Create Session
            </button>
            
            <!-- Active Session Button -->
            <div th:if="${activeSession != null}" class="text-center">
                <button class="btn action-btn btn-primary" data-bs-toggle="modal" data-bs-target="#continueSessionModal">
                    <i class="bi bi-play-circle-fill"></i>
                    <span th:text="${activeSession.name}">Session Name</span>
                </button>
                <div class="mt-2 text-muted small">Continue Session</div>
            </div>
        </div>

    </div>

    <!-- Continue Session Modal -->
    <div class="modal fade" id="continueSessionModal" tabindex="-1" aria-hidden="true" th:if="${activeSession != null}">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:rgba(10,15,30,0.92)!important;backdrop-filter:blur(48px) saturate(160%);-webkit-backdrop-filter:blur(48px) saturate(160%);border:1px solid rgba(255,255,255,0.15)!important;border-radius:18px;color:rgba(255,255,255,0.9);">
                <div class="modal-header" style="background:rgba(59,130,246,0.10);border-bottom:1px solid rgba(255,255,255,0.1);border-radius:18px 18px 0 0;padding:18px 24px 14px;">
                    <div class="d-flex align-items-center gap-3">
                        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;flex-shrink:0;"><i class="bi bi-gear-fill"></i></div>
                        <h5 class="modal-title fw-bold mb-0" style="color:#fff;font-size:1.05rem;">Manage Session</h5>
                    </div>
                    <button type="button" class="btn-close" style="filter:invert(1) grayscale(100%) brightness(200%);" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center" style="padding:28px 24px;">
                    <h4 class="mb-3 fw-bold" th:text="${activeSession.name}" style="color:#fff;">Session Name</h4>
                    <p class="mb-4" style="color:rgba(255,255,255,0.6);font-size:0.9rem;">What would you like to do with this session?</p>
                    <div class="d-grid gap-3 col-8 mx-auto">
                        <a href="/" class="btn btn-lg d-flex align-items-center justify-content-center gap-2"
                           style="background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;color:#fff;font-weight:700;border-radius:12px;padding:12px;">
                            <i class="bi bi-arrow-right-circle-fill"></i> Continue Session
                        </a>
                        <button type="button"
                                class="btn btn-lg d-flex align-items-center justify-content-center gap-2"
                                style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;font-weight:700;border-radius:12px;padding:12px;"
                                onclick="openEbReviewModal()">
                            <i class="bi bi-stop-circle-fill"></i> End Session
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- EB Review Modal (shown when user clicks End Session) -->
    <div class="modal fade" id="ebReviewModal" tabindex="-1" aria-labelledby="ebReviewModalLabel" aria-hidden="true"
         th:if="${activeSession != null}">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0 px-4 pt-4 pb-2">
                    <div>
                        <h5 class="modal-title fw-bold mb-1" id="ebReviewModalLabel"
                            style="color: rgba(255,255,255,0.95); font-size: 1.15rem;">
                            <i class="bi bi-journal-check me-2" style="opacity:0.75;"></i>End Session — EB Review
                        </h5>
                        <p class="mb-0" style="color:rgba(255,255,255,0.5); font-size:0.82rem;">
                            Write your Executive Board review before closing this session. This will be saved in history.
                        </p>
                    </div>
                    <button type="button" class="btn-close btn-close-white ms-auto mt-1"
                            data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 py-3">
                    <label for="ebReviewTextarea" class="form-label mb-2"
                           style="font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase;
                                  font-weight:600; color:rgba(255,255,255,0.45);">
                        <i class="bi bi-pencil-fill me-1"></i>EB Review Notes
                    </label>
                    <textarea id="ebReviewTextarea" rows="10" class="form-control"
                              placeholder="Write the EB review for this session..."
                              style="background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.18);
                                     border-radius:12px; color:rgba(255,255,255,0.9) !important; font-size:1rem;
                                     line-height:1.65; resize:vertical; padding:14px 16px;"></textarea>
                    <style>
                        #ebReviewTextarea::placeholder { color:rgba(255,255,255,0.3); }
                        #ebReviewTextarea:focus { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.35);
                            box-shadow:0 0 0 3px rgba(255,255,255,0.08); color:rgba(255,255,255,0.95) !important; outline:none; }
                    </style>
                </div>
                <div class="modal-footer border-0 px-4 pb-4 pt-2 d-flex gap-2 justify-content-end">
                    <button type="button" data-bs-dismiss="modal"
                            class="btn btn-sm px-4"
                            style="background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.18);
                                   color:rgba(255,255,255,0.7); border-radius:50px; font-size:0.85rem;">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </button>
                    <button type="button" onclick="confirmEndSession()"
                            class="btn btn-sm px-4"
                            style="background:rgba(239,68,68,0.75); border:1px solid rgba(239,68,68,0.5);
                                   color:white; border-radius:50px; font-size:0.85rem; font-weight:700;">
                        <i class="bi bi-stop-circle-fill me-1"></i>Confirm End Session
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden form used by confirmEndSession() to POST /session/end with ebReview -->
    <form id="endSessionForm" th:if="${activeSession != null}"
          th:action="@{/session/end}" method="post" style="display:none;">
        <input type="hidden" name="sessionId" th:value="${activeSession.id}" />
        <input type="hidden" name="ebReview"  id="endSessionEbReview" value="" />
    </form>

    <!-- Create Session Modal -->
    <div class="modal fade" id="createSessionModal" tabindex="-1" aria-labelledby="createSessionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:rgba(10,15,30,0.92)!important;backdrop-filter:blur(48px) saturate(160%);-webkit-backdrop-filter:blur(48px) saturate(160%);border:1px solid rgba(255,255,255,0.15)!important;border-radius:18px;color:rgba(255,255,255,0.9);">
                <div class="modal-header" style="background:rgba(16,185,129,0.10);border-bottom:1px solid rgba(255,255,255,0.1);border-radius:18px 18px 0 0;padding:18px 24px 14px;">
                    <div class="d-flex align-items-center gap-3">
                        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;flex-shrink:0;"><i class="bi bi-plus-square-fill"></i></div>
                        <h5 class="modal-title fw-bold mb-0" id="createSessionModalLabel" style="color:#fff;font-size:1.05rem;">Create New Session</h5>
                    </div>
                    <button type="button" class="btn-close" style="filter:invert(1) grayscale(100%) brightness(200%);" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/session/create}" th:object="${newSession}" method="post">
                        <div class="mb-3">
                            <label for="sessionName" class="form-label">
                                <i class="bi bi-tag-fill me-1"></i> Name of the Session
                            </label>
                            <input type="text" class="form-control" id="sessionName" th:field="*{name}" placeholder="Enter session name..." required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="committee" class="form-label">
                                <i class="bi bi-mortarboard-fill me-1"></i> Committee
                            </label>
                            <select class="form-select" id="committee" th:field="*{committee}" required>
                                <option value="Physics">Physics</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Biology">Biology</option>
                                <option value="Computer Science">Computer Science</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="strength" class="form-label">
                                <i class="bi bi-people-fill me-1"></i> Strength (Number of Participants)
                            </label>
                            <input type="number" class="form-control" id="strength" th:field="*{strength}" placeholder="Enter number of participants..." min="1" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="topic" class="form-label">
                                <i class="bi bi-chat-left-text-fill me-1"></i> Topic of the session
                            </label>
                            <input type="text" class="form-control" id="topic" th:field="*{topic}" placeholder="Enter session topic..." required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-check-circle-fill"></i> Create Session
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>

    <!-- EB Review modal helpers -->
    <script>
        function openEbReviewModal() {
            // Close the continue-session modal first
            const contModal = bootstrap.Modal.getInstance(document.getElementById('continueSessionModal'));
            if (contModal) contModal.hide();
            // Wait for it to finish hiding before showing the review modal
            const ebModalEl = document.getElementById('ebReviewModal');
            if (!ebModalEl) return;
            const contModalEl = document.getElementById('continueSessionModal');
            const openReview = () => new bootstrap.Modal(ebModalEl).show();
            if (contModalEl) {
                contModalEl.addEventListener('hidden.bs.modal', openReview, { once: true });
            } else {
                openReview();
            }
        }

        function confirmEndSession() {
            const review = document.getElementById('ebReviewTextarea')?.value ?? '';
            document.getElementById('endSessionEbReview').value = review;
            document.getElementById('endSessionForm').submit();
        }
    </script>

    <!-- Theme Toggle Script -->
    <script>
        // Simplified setTheme — the navbar toggle pill handles visuals via CSS body.dark-mode
        window.setTheme = function(theme) {
            const html = document.documentElement;
            const body = document.body;
            if (theme === 'dark') {
                html.classList.remove('dark-mode-loading');
                html.classList.add('dark-mode');
                body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                html.classList.remove('dark-mode-loading');
                html.classList.remove('dark-mode');
                body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        });
    </script>
</body>
</html>
