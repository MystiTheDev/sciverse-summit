<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SciVerse Summit Chair</title>
<link rel="stylesheet" href="splash.css">
</head>
<body style="margin:0;background:transparent;overflow:hidden;">
<div id="splashRoot"></div>
<script src="splash.js"></script>
<script>
(function () {
  var stage = [
    [12, 'Loading the interface…'],
    [46, 'Reading your settings…'],
    [78, 'Preparing the console…']
  ];
  var q = {};
  try {
    q = Object.fromEntries(new URLSearchParams(window.location.search).entries());
  } catch (e) { /* defaults stand in */ }

  var splash = window.Splash.mount(document.getElementById('splashRoot'), {
    role: 'Chair',
    tagline: 'A Committee Session Platform. For The Chair.',
    description: 'An operating system for the chairs of SciVerse Summit.',
    version: q.v || '',
    logo: 'logo.png',
    year: '2026',
    // A backstop for a page that never gets a handoff, not a schedule. Well
    // clear of the real ~1.6s minimum plus exit, so it cannot cut the splash
    // short or close the window out from under the app while it loads.
    capMs: 12000,
    // The main process reveals the console on this signal, so the splash
    // owns its own minimum and exit instead of being cut short.
    onReady: function () { try { window.close(); } catch (e) { /* host closes us */ } }
  });

  // The console reports real boot stages. The splash stays visible for its
  // minimum regardless, so this reads as progress rather than a wait.
  var pct = 12;
  splash.set(pct, stage[0][1]);
  var t = setInterval(function () {
    if (pct >= 78) { clearInterval(t); return; }
    pct = Math.min(78, pct + 4);
    var label = stage[0][1];
    for (var i = 0; i < stage.length; i++) {
      if (pct >= stage[i][0]) label = stage[i][1];
    }
    splash.set(pct, label);
  }, 120);

  // The host hands over by calling window.SummitSplashHost.done(), which
  // shared/splash.js exposes from mount(). It is a function call rather
  // than a message event because this window has no preload, so
  // webContents.send() has no ipcRenderer.on() to arrive in.
})();
</script>
</body>
</html>
