<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SciVerse Summit Delegate</title>
<link rel="stylesheet" href="splash.css">
</head>
<body style="margin:0;background:transparent;overflow:hidden;">
<div id="splashRoot"></div>
<script src="splash.js"></script>
<script>
(function () {
  var stage = [
    [12, 'Finding your seat…'],
    [40, 'Passing the mic check…'],
    [66, 'Reading the draft verdict…']
  ];
  var q = {};
  try {
    q = Object.fromEntries(new URLSearchParams(window.location.search).entries());
  } catch (e) { /* defaults stand in */ }

  var splash = window.Splash.mount(document.getElementById('splashRoot'), {
    role: 'Delegate',
    tagline: 'Built For The Delegate Seat.',
    description: 'An operating system for the delegates of SciVerse Summit.',
    version: q.v || '',
    logo: 'logo.png',
    year: '2026',
    // A backstop for a page that never gets a handoff, not a schedule. Well
    // clear of the real ~1.6s minimum plus exit, so it cannot cut the splash
    // short or close the window out from under the app while it loads.
    capMs: 12000,
    // The main process reveals the app on this signal, so the splash keeps
    // its own minimum hold and exit instead of being cut short.
    onReady: function () { try { window.close(); } catch (e) { /* host closes us */ } }
  });

  // Delegate boot has no long stages of its own: start honest, then creep
  // toward a ceiling without ever claiming completion the app has not reached.
  // The main window closes this splash the moment it is actually ready.
  var pct = 12;
  splash.set(pct, stage[0][1]);
  var t = setInterval(function () {
    if (pct >= 92) { clearInterval(t); return; }
    pct = Math.min(92, pct + 2);
    var label = stage[0][1];
    for (var i = 0; i < stage.length; i++) {
      if (pct >= stage[i][0]) label = stage[i][1];
    }
    splash.set(pct, label);
  }, 130);

  // The connect screen tells us when it is genuinely up.
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'splash:done') {
      clearInterval(t);
      splash.set(100, 'Ready');
      splash.ready();
    }
  });
})();
</script>
</body>
</html>
