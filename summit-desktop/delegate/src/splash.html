<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SciVerse Summit Delegate</title>
<link rel="stylesheet" href="splash.css">
</head>
<body style="margin:0;background:transparent;overflow:hidden;">
<div id="splashRoot"></div>
<script src="splash.js"></script>
<script>
(function () {
  var stage = [
    [12, 'Finding your seat…'],
    [40, 'Passing the mic check…'],
    [66, 'Reading the draft verdict…']
  ];
  var q = {};
  try {
    q = Object.fromEntries(new URLSearchParams(window.location.search).entries());
  } catch (e) { /* defaults stand in */ }

  var splash = window.Splash.mount(document.getElementById('splashRoot'), {
    role: 'Delegate',
    tagline: 'Built For The Delegate Seat.',
    description: 'No setup, no accounts, no internet. Your chair\u2019s address is all you need to join the session and take your seat.',
    version: q.v || '',
    logo: 'logo.png',
    year: '2026'
  });

  // Delegate boot has no long stages of its own: start honest, then creep
  // toward a ceiling without ever claiming completion the app has not reached.
  // The main window closes this splash the moment it is actually ready.
  var pct = 12;
  splash.set(pct, stage[0][1]);
  var t = setInterval(function () {
    if (pct >= 92) { clearInterval(t); return; }
    pct = Math.min(92, pct + 2);
    var label = stage[0][1];
    for (var i = 0; i < stage.length; i++) {
      if (pct >= stage[i][0]) label = stage[i][1];
    }
    splash.set(pct, label);
  }, 130);
})();
</script>
</body>
</html>
