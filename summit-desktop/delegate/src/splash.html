<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SciVerse Summit Delegate</title>
<link rel="stylesheet" href="splash.css">
</head>
<body style="margin:0;background:transparent;overflow:hidden;">
<div id="splashRoot"></div>
<script src="splash.js"></script>
<script>
(function () {
  var stage = [
    [12, 'Finding your seat…'],
    [40, 'Passing the mic check…'],
    [66, 'Reading the draft verdict…']
  ];
  var q = {};
  try {
    q = Object.fromEntries(new URLSearchParams(window.location.search).entries());
  } catch (e) { /* defaults stand in */ }

  var splash = window.Splash.mount(document.getElementById('splashRoot'), {
    stages: stage,
    role: 'Delegate',
    tagline: 'Built For The Delegate Seat.',
    description: 'An operating system for the delegates of SciVerse Summit.',
    version: q.v || '',
    logo: 'logo.png',
    year: '2026',
    // A backstop for a page that never gets a handoff, not a schedule. It
    // has to clear the real minimum hold (5s) plus the exit animation, or it
    // would cut the splash short and close the window out from under the app
    // while it is still loading.
    capMs: 12000,
    // The main process reveals the app on this signal, so the splash keeps
    // its own minimum hold and exit instead of being cut short.
    onReady: function () { try { window.close(); } catch (e) { /* host closes us */ } }
  });

  // Delegate boot has no long stages of its own: start honest, then creep
  // toward a ceiling without ever claiming completion the app has not reached.
  // The main window closes this splash the moment it is actually ready.
  // The progress ramp is owned by shared/splash.js, which times it against
  // this splash's own hold so the bar keeps moving for as long as the card
  // is on screen, and reaches 100% only as it leaves. `stage` below is just
  // the labels it steps through on the way.
  //
  // A per-page setInterval used to live here: a fixed step unrelated to the
  // hold, a different ceiling per app, and nothing stopped it at hand-off, so
  // it went on overwriting the status line after the bar had reached 100%.

  // The host hands over by calling window.SummitSplashHost.done(), which
  // shared/splash.js exposes from mount(). It is a function call rather
  // than a message event because this window has no preload, so
  // webContents.send() has no ipcRenderer.on() to arrive in.
})();
</script>
</body>
</html>
