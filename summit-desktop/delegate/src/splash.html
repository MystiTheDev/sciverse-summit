<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SciVerse Summit Delegate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-app-region: drag;
  }
  /* Portrait stage: deep-navy card, light tile pill on top,
     dark badge overlapping — original art, Corel-style composition. */
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    overflow: hidden;
    background: linear-gradient(165deg, #0c1428, #191745 70%, #101a3a);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .pill {
    position: absolute;
    top: 26px;
    left: 26px;
    right: 26px;
    height: 44%;
    border-radius: 999px;
    background: linear-gradient(150deg, #ffffff, #dbeafe);
    overflow: hidden;
    box-shadow: inset 0 2px 12px rgba(15, 23, 42, 0.12);
  }
  .tile { position: absolute; animation: drift 5s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateY(-7px) rotate(-4deg); } to { transform: translateY(7px) rotate(5deg); } }
  .t-circle { border-radius: 50%; }
  .t-sq { border-radius: 6px; }
  .t-tri { width: 0 !important; height: 0 !important; background: none !important; border-left: 11px solid transparent; border-right: 11px solid transparent; }
  .t-ring { border-radius: 50%; background: none !important; }
  .t-bar { border-radius: 999px; }
  .t-sym { font-weight: 800; line-height: 1; }
  .badge {
    position: absolute;
    left: 50%;
    top: 37%;
    transform: translateX(-50%);
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 32%, #1b2547, #070c1d 72%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    color: #f1f5f9;
  }
  .badge img {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    box-shadow: 0 12px 34px rgba(6, 182, 212, 0.4);
    margin-bottom: 10px;
  }
  .badge h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.01em; color: #fff; }
  .badge h1 .yr { font-weight: 600; color: #67e8f9; font-size: 0.95rem; }
  .badge p.role {
    color: #94a3b8;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .badge p.status {
    font-size: 0.74rem;
    color: #8ea0b8;
    min-height: 1.1em;
    margin-top: 8px;
    transition: opacity 0.4s ease;
  }
  .badge p.status.fade { opacity: 0; }
  .bar {
    width: 150px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    margin-top: 10px;
    overflow: hidden;
  }
  .bar .fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #06b6d4, #7c3aed);
    animation: fill 13.6s linear forwards;
  }
  @keyframes fill { from { width: 0; } to { width: 100%; } }
  .badge p.legal { font-size: 0.62rem; color: #475569; margin-top: 10px; line-height: 1.5; }
  .badge p.legal .ver { color: #64748b; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="pill" aria-hidden="true">
      <!-- Domain icons (fixed spread grid — no randomizer): physics / chemistry /
           biology / computer-science, all inline SVG + type, offline-safe. -->
      <!-- Row 1: atom, flask, DNA, code -->
      <span class="tile" style="left:6%;top:10%;animation-duration:4.2s;"><svg viewBox="0 0 64 64" width="38" height="38"><g fill="none" stroke="#06b6d4" stroke-width="3.5"><ellipse cx="32" cy="32" rx="26" ry="10"/><ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(120 32 32)"/><circle cx="32" cy="32" r="5" fill="#06b6d4" stroke="none"/></g></svg></span>
      <span class="tile" style="left:30%;top:12%;animation-duration:5.4s;"><svg viewBox="0 0 64 64" width="36" height="36"><g fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M27 6h10v13l12 25a8 8 0 0 1-7.2 12H22.2A8 8 0 0 1 15 44L27 19V6z"/><path d="M23 41h18l4 7" opacity=".55"/></g></svg></span>
      <span class="tile" style="left:55%;top:10%;animation-duration:4.7s;"><svg viewBox="0 0 64 64" width="34" height="40"><g fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"><path d="M24 6c0 13 16 13 16 26S24 45 24 58"/><path d="M40 6c0 13-16 13-16 26s16 13 16 26"/><path d="M25 19h14M25 32h14M25 45h14"/></g></svg></span>
      <span class="tile t-sym" style="left:80%;top:14%;font-size:30px;color:#7c3aed;animation-duration:4.9s;">&lt;/&gt;</span>
      <!-- Row 2: molecule, magnet, leaf, chip -->
      <span class="tile" style="left:8%;top:40%;animation-duration:5.9s;"><svg viewBox="0 0 64 64" width="36" height="36"><g stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"><path d="M26 26l10-6M39 26l-3 12" fill="none"/><g fill="#3b82f6" stroke="none"><circle cx="21" cy="29" r="6"/><circle cx="42" cy="17" r="4.5"/><circle cx="35" cy="45" r="7"/></g></g></svg></span>
      <span class="tile" style="left:32%;top:42%;animation-duration:4.4s;"><svg viewBox="0 0 64 64" width="34" height="34"><g fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"><path d="M22 12v18a10 10 0 0 0 20 0V12"/><path d="M15 12h14M35 12h14" stroke-width="7"/></g></svg></span>
      <span class="tile" style="left:56%;top:40%;animation-duration:5.8s;"><svg viewBox="0 0 64 64" width="34" height="34"><g fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"><path d="M32 8C21 21 19 39 32 56 45 39 43 21 32 8z"/><path d="M32 18v30"/></g></svg></span>
      <span class="tile" style="left:80%;top:42%;animation-duration:5.1s;"><svg viewBox="0 0 64 64" width="36" height="36"><g fill="none" stroke="#0891b2" stroke-width="3"><rect x="21" y="21" width="22" height="22" rx="4"/><path d="M27 21v-7M32 21v-7M37 21v-7M27 50v-7M32 50v-7M37 50v-7M21 27h-7M21 32h-7M21 37h-7M50 27h-7M50 32h-7M50 37h-7" stroke-linecap="round"/></g></svg></span>
      <!-- Row 3: planet, benzene, cell, binary -->
      <span class="tile" style="left:10%;top:68%;animation-duration:4.6s;"><svg viewBox="0 0 64 64" width="40" height="40"><g fill="none" stroke="#f97316" stroke-width="3.5"><circle cx="32" cy="32" r="11"/><ellipse cx="32" cy="32" rx="24" ry="8" transform="rotate(-18 32 32)"/></g></svg></span>
      <span class="tile" style="left:34%;top:70%;animation-duration:4.3s;"><svg viewBox="0 0 64 64" width="34" height="34"><g fill="none" stroke="#14b8a6" stroke-width="3.5" stroke-linejoin="round"><polygon points="32,12 50,22 50,42 32,52 14,42 14,22"/><circle cx="32" cy="32" r="7"/></g></svg></span>
      <span class="tile" style="left:58%;top:68%;animation-duration:5.3s;"><svg viewBox="0 0 64 64" width="34" height="34"><g fill="none" stroke="#65a30d" stroke-width="3.5"><circle cx="32" cy="32" r="19"/><circle cx="32" cy="32" r="7" fill="#65a30d" opacity=".45" stroke="none"/><circle cx="44" cy="23" r="2.5" fill="#65a30d" stroke="none"/></g></svg></span>
      <span class="tile t-sym" style="left:82%;top:70%;font-size:24px;color:#db2777;font-family:Consolas,monospace;animation-duration:5.5s;">01</span>
    </div>
    <div class="badge">
      <img src="logo.png" alt="SciVerse Summit logo">
      <h1>SciVerse Summit <span class="yr">3.0</span></h1>
      <p class="role">Delegate</p>
      <p class="status" id="hint">Starting up&hellip;</p>
      <div class="bar"><div class="fill"></div></div>
      <p class="legal"><span class="ver" id="ver"></span><br>&copy; 2026 SciVerse. All rights reserved.</p>
    </div>
  </div>
<script>
(function () {
  try {
    var v = new URLSearchParams(window.location.search).get('v');
    if (v) document.getElementById('ver').textContent = 'v' + v;
  } catch (e) { /* version stays blank */ }
  var lines = [
    'Finding your seat\u2026',
    'Passing the mic check\u2026',
    'Reading the draft verdict\u2026',
    'Raising your placard\u2026',
    'Joining the session\u2026'
  ];
  var hint = document.getElementById('hint');
  var i = 0;
  setInterval(function () {
    hint.classList.add('fade');
    setTimeout(function () {
      i = (i + 1) % lines.length;
      hint.textContent = lines[i];
      hint.classList.remove('fade');
    }, 400);
  }, 2200);
})();
</script>
</body>
</html>
