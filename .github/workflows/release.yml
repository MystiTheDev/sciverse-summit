# SciVerse Summit — release pipeline (Route B).
#
# Trigger: publish a GitHub Release (tag vX.Y.Z, full publish — not draft,
# not pre-release). The workflow builds everything from this repo and attaches
# the files back to that same Release:
#   Windows: Chair Setup exe + chair.yml + blockmap
#            Delegate Setup exe + delegate.yml + blockmap
#   Linux:   Chair AppImage + chair-linux.yml + blockmap
#            Delegate AppImage + delegate-linux.yml + blockmap
#
# Your checklist per release (nothing else):
#   1. Bump "version" in the package.json of the app(s) you changed. The
#      version must equal the tag (no leading v). An app whose version does
#      NOT equal the tag is skipped, so you only bump what you changed.
#      At least one of the two must match, or the run fails loudly.
#   2. Commit + push to main.
#   3. Draft a Release with tag vX.Y.Z, paste notes, Publish.
#   4. Wait ~15 min, check the Release — files appear automatically.
#   5. Install once manually; every later release self-installs via auto-update.
#
# Chair-only releases are the common case. The delegate is a thin shell: its
# own code is just the connect screen, and every page it shows is served by
# the chair's jar. So a delegate that skips a release loses nothing — it picks
# up the new interface from the chair the next time it connects, without
# installing anything.
#
# Each app also has its own auto-update channel ("chair" / "delegate"), so a
# delegate is never offered a build that did not include it.
#
# Test without publishing: Actions tab -> "Release installers" -> Run workflow
# (builds both apps, attaches nothing, ignores versions).

name: Release installers

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  TEMURIN_WIN_JRE: https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse

jobs:
  # Decides which apps this release actually contains, before anything is built.
  # An app is built only when its package.json version equals the release tag.
  # This replaces the old per-job "version must match tag" check, which forced
  # both apps to be bumped in lockstep even for a chair-only change.
  plan:
    name: Plan release contents
    runs-on: ubuntu-latest
    outputs:
      build_chair: ${{ steps.decide.outputs.build_chair }}
      build_delegate: ${{ steps.decide.outputs.build_delegate }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: decide
        name: Compare app versions against the tag
        run: |
          set -euo pipefail
          chair=$(node -p "require('./summit-desktop/chair/package.json').version")
          delegate=$(node -p "require('./summit-desktop/delegate/package.json').version")

          if [ "${{ github.event_name }}" != "release" ]; then
            # Manual test run: no tag, so build everything and check nothing.
            echo "Manual run — building both apps, ignoring versions."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "build_chair=true" >> "$GITHUB_OUTPUT"
            echo "build_delegate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${{ github.event.release.tag_name }}"; tag="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "chair in repo:    $chair"
          echo "delegate in repo: $delegate"
          echo "release tag:      $tag"

          build_chair=false;    [ "$chair"    = "$tag" ] && build_chair=true
          build_delegate=false; [ "$delegate" = "$tag" ] && build_delegate=true

          if [ "$build_chair" = false ] && [ "$build_delegate" = false ]; then
            echo "::error::Tag $tag matches neither chair ($chair) nor delegate ($delegate). Bump the version of the app you changed, or fix the tag."
            exit 1
          fi

          echo "build_chair=$build_chair" >> "$GITHUB_OUTPUT"
          echo "build_delegate=$build_delegate" >> "$GITHUB_OUTPUT"

          {
            echo "## Release plan"
            echo ""
            echo "| app | version | in this release |"
            echo "| --- | --- | --- |"
            echo "| chair | $chair | $build_chair |"
            echo "| delegate | $delegate | $build_delegate |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-jar:
    name: Web jar (Maven)
    needs: plan
    if: needs.plan.outputs.build_chair == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Build fat jar
        run: ./mvnw -B package -DskipTests
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: summit-jar
          path: target/summit-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  chair-win:
    name: Chair (Windows NSIS)
    needs: [plan, build-jar]
    if: needs.plan.outputs.build_chair == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Stage summit.jar
        uses: actions/download-artifact@v4
        with:
          name: summit-jar
          path: summit-desktop/chair/server/
      - name: Rename staged jar to summit.jar
        run: Move-Item summit-desktop/chair/server/summit-0.0.1-SNAPSHOT.jar summit-desktop/chair/server/summit.jar -Force
      - name: Stage Windows JRE (Temurin 17)
        run: |
          Invoke-WebRequest -Uri $env:TEMURIN_WIN_JRE -OutFile "$env:TEMP\win-jre.zip"
          Expand-Archive -Path "$env:TEMP\win-jre.zip" -DestinationPath "$env:TEMP\win-jre"
          $inner = Get-ChildItem "$env:TEMP\win-jre" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path summit-desktop/chair/server/jre | Out-Null
          Copy-Item -Recurse -Force (Join-Path $inner.FullName '*') summit-desktop/chair/server/jre
          & summit-desktop/chair/server/jre/bin/java.exe -version
      - name: Build installer
        working-directory: summit-desktop/chair
        run: |
          npm ci
          npm run dist -- --win nsis --publish never
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: chair-win
          path: |
            summit-desktop/chair/dist/*.exe
            summit-desktop/chair/dist/chair.yml
            summit-desktop/chair/dist/*.blockmap
          if-no-files-found: error

  delegate-win:
    name: Delegate (Windows NSIS)
    needs: plan
    if: needs.plan.outputs.build_delegate == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build installer
        working-directory: summit-desktop/delegate
        run: |
          npm ci
          npm run dist -- --win nsis --publish never
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: delegate-win
          path: |
            summit-desktop/delegate/dist/*.exe
            summit-desktop/delegate/dist/delegate.yml
            summit-desktop/delegate/dist/*.blockmap
          if-no-files-found: error

  chair-linux:
    name: Chair (Linux AppImage)
    needs: [plan, build-jar]
    if: needs.plan.outputs.build_chair == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Point feed at chair channel (builder appends -linux itself)
        run: node -e "const fs=require('fs');const p='summit-desktop/chair/package.json';const j=JSON.parse(fs.readFileSync(p));j.build.publish[0].channel='chair';fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('channel now:',JSON.parse(fs.readFileSync(p)).build.publish[0].channel);"
      - name: Stage summit.jar
        uses: actions/download-artifact@v4
        with:
          name: summit-jar
          path: summit-desktop/chair/server/
      - name: Rename staged jar to summit.jar
        run: mv summit-desktop/chair/server/summit-0.0.1-SNAPSHOT.jar summit-desktop/chair/server/summit.jar
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Stage Linux JRE (jlink mini-runtime)
        run: |
          jlink --add-modules java.se,jdk.zipfs,jdk.unsupported,jdk.crypto.cryptoki,jdk.management,jdk.net,jdk.localedata --strip-debug --no-man-pages --no-header-files --compress=2 --output summit-desktop/chair/server/jre
          summit-desktop/chair/server/jre/bin/java -version
      - name: Build AppImage
        working-directory: summit-desktop/chair
        run: |
          npm ci
          # dist:linux, NOT `dist -- --linux`: the dist script hardcodes
          # --win nsis, so the Linux job also asked for a Windows installer,
          # which needs wine on an Ubuntu runner and fails the build.
          npm run dist:linux -- --publish never
      - name: Verify dist contents (fail loudly on missing feed)
        run: |
          ls -la summit-desktop/chair/dist/
          test -f summit-desktop/chair/dist/chair-linux.yml || { echo "MISSING chair-linux.yml — update feed is broken"; exit 1; }
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: chair-linux
          path: |
            summit-desktop/chair/dist/*.AppImage
            summit-desktop/chair/dist/chair-linux.yml
            summit-desktop/chair/dist/*.blockmap
          if-no-files-found: error

  delegate-linux:
    name: Delegate (Linux AppImage)
    needs: plan
    if: needs.plan.outputs.build_delegate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Point feed at delegate channel (builder appends -linux itself)
        run: node -e "const fs=require('fs');const p='summit-desktop/delegate/package.json';const j=JSON.parse(fs.readFileSync(p));j.build.publish[0].channel='delegate';fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('channel now:',JSON.parse(fs.readFileSync(p)).build.publish[0].channel);"
      - name: Build AppImage
        working-directory: summit-desktop/delegate
        run: |
          npm ci
          # dist:linux, NOT `dist -- --linux`: the dist script hardcodes
          # --win nsis, so the Linux job also asked for a Windows installer,
          # which needs wine on an Ubuntu runner and fails the build.
          npm run dist:linux -- --publish never
      - name: Verify dist contents (fail loudly on missing feed)
        run: |
          ls -la summit-desktop/delegate/dist/
          test -f summit-desktop/delegate/dist/delegate-linux.yml || { echo "MISSING delegate-linux.yml — update feed is broken"; exit 1; }
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: delegate-linux
          path: |
            summit-desktop/delegate/dist/*.AppImage
            summit-desktop/delegate/dist/delegate-linux.yml
            summit-desktop/delegate/dist/*.blockmap
          if-no-files-found: error

  attach:
    name: Attach files to Release
    needs: [plan, chair-win, delegate-win, chair-linux, delegate-linux]
    # always(), because the build jobs for an app not in this release are
    # skipped rather than failed, and a skipped dependency would otherwise
    # skip this job too.
    if: always() && github.event_name == 'release' && needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach to this Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          # Unmatched globs are expected: an app not in this release has no
          # artifact directory. A verification step below is the real check.
          fail_on_unmatched_files: false
          files: |
            ${{ needs.plan.outputs.build_chair == 'true' && 'artifacts/chair-win/*' || '' }}
            ${{ needs.plan.outputs.build_chair == 'true' && 'artifacts/chair-linux/*' || '' }}
            ${{ needs.plan.outputs.build_delegate == 'true' && 'artifacts/delegate-win/*' || '' }}
            ${{ needs.plan.outputs.build_delegate == 'true' && 'artifacts/delegate-linux/*' || '' }}
      # The auto-update feed files are what actually make an update work.
      # Per-platform: a platform that failed to build must not cost the other
      # platforms their installers, so a missing feed is a loud warning and
      # only a total absence for a planned app fails the job.
      - name: Verify the release received the expected update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          WANT_CHAIR: ${{ needs.plan.outputs.build_chair }}
          WANT_DELEGATE: ${{ needs.plan.outputs.build_delegate }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"
          printf '%s\n' "$assets" | sed 's/^/  /'

          count=$(printf '%s\n' "$assets" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::No assets were attached to $TAG."
            exit 1
          fi

          missing=""
          if [ "$WANT_CHAIR" = "true" ]; then
            printf '%s\n' "$assets" | grep -qx 'chair.yml'        || missing="$missing chair.yml"
            printf '%s\n' "$assets" | grep -qx 'chair-linux.yml' || missing="$missing chair-linux.yml"
          fi
          if [ "$WANT_DELEGATE" = "true" ]; then
            printf '%s\n' "$assets" | grep -qx 'delegate.yml'        || missing="$missing delegate.yml"
            printf '%s\n' "$assets" | grep -qx 'delegate-linux.yml' || missing="$missing delegate-linux.yml"
          fi

          if [ -n "$missing" ]; then
            echo ""
            echo "::warning::These update feeds are missing:$missing"
            echo "Users on that platform will not be offered this version."
            echo "Everything that did build has still been attached."
            {
              echo ""
              echo "## Partial release"
              echo ""
              echo "These update feeds were not produced:$missing"
              echo ""
              echo "Users on the affected platform will not be offered this"
              echo "version by auto-update. Every other platform is up to date."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo ""
          echo "Release check complete."

